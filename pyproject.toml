[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stowsign"
version = "0.1.0"
description = "Presigned URL issuing and verification for object storage"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["stowsign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
