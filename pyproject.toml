[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigvault"
version = "0.1.0"
description = "Presigned URL service in front of an internal object store"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sigvault = "sigvault.app:main"

[tool.setuptools]
packages = ["sigvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
