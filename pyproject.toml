[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hostfold"
version = "0.1.0"
description = "Authority normalization for an outbound forward proxy"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["hostfold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
