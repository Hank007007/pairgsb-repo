[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tplsentry"
version = "0.1.0"
description = "Sandboxed notification template engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["tplsentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
