[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hlsmith"
version = "0.6.0"
description = "样本流 -> HLS（fMP4）打包器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hlsmith = "hlsmith.cli:main"

[tool.setuptools.packages.find]
include = ["hlsmith*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
