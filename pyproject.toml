[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hooksign"
version = "0.4.0"
description = "Webhook 请求签名与校验（X-Signature v2）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["hooksign*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
