[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfgfold"
version = "0.1.0"
description = "Tenant configuration loader for the control plane"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
cfgfold = "cfgfold.__main__:main"

[tool.setuptools]
packages = ["cfgfold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
