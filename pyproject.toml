[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "outpostcall-egress"
version = "0.1.0"
description = "Outbound webhook delivery: URL construction, signing, egress policy, transport"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["outpostcall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"