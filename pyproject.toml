[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "redosgate-pattern-check"
version = "0.1.0"
description = "Budget layer for tenant supplied regular expressions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["regex>=2023.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["redos_gate"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
