# Example policy table for the sudopolicy command line front end and the
# executor. See docs/policy-grammar.md for the syntax.
#
# The file is read top to bottom; later rules take precedence over earlier ones.

root,ops web1 = (root) NOPASSWD: /bin/ls *
root,ops web1 = (root) NOPASSWD: /usr/bin/systemctl restart nginx
deploy   web1 = (www-data) NOPASSWD: SETENV: /usr/bin/rsync --archive **

ops      db1  = (postgres) NOPASSWD: /usr/bin/systemctl **
!ops     db1  = (postgres) /usr/bin/systemctl restart postgresql

ops      db1  = (postgres) /usr/bin/psql

admin    *    = (root) PASSWD: /usr/bin/apt-get
