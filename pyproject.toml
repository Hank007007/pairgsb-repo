[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subsetwitness"
version = "0.1.0"
description = "Verifiable selective disclosure for audit logs"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
subsetctl = "subsetwitness.cli:main"

[tool.setuptools]
packages = ["subsetwitness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
