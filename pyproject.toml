[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filterweave"
version = "0.1.0"
description = "LDAP filter assembly helpers for the employee directory"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["filterweave"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
